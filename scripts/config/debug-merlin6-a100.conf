#!/bin/bash

#
# Configuration file for tests on A100 GPUs on Merlin6
#

#-------------------------------------------------------------------------------
# Branches 
#
branch="master"
regtests_branch="cleanup"

#-------------------------------------------------------------------------------
# Architecture
#
architecture="gpu-cuda-a100"

#-------------------------------------------------------------------------------
# CMake args
#
cmake_args+=("-DBUILD_TYPE=Debug")
cmake_args+=("-DPLATFORMS=CUDA")
cmake_args+=("-DARCH=AMPERE80")
cmake_args+=("-DCMAKE_CUDA_ARCHITECTURES=80") # GPU arch not propagated to heffte
cmake_args+=("-DOPALX_ENABLE_UNIT_TESTS=ON")

#-------------------------------------------------------------------------------
# OPALX args 
#
#opalx_args=()

#-------------------------------------------------------------------------------
# Unit tests args
#
#unittests_args=()

#-------------------------------------------------------------------------------
# Modules 
#

module purge
module use unstable
module load gcc/12.4.0 openmpi/4.1.6_slurm
module load gnutls
module load Python
module load gnuplot
module load cmake/3.27.8
